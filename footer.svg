<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Footer wave" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Back wave -->
  <path fill="url(#bg)" fill-opacity="0.45"
        d="M0 35 C150 -5 450 75 600 35 C750 -5 1050 75 1200 35 C1350 -5 1650 75 1800 35 C1950 -5 2250 75 2400 35 V120 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- Front wave -->
  <path fill="url(#bg)"
        d="M0 55 C150 25 450 85 600 55 C750 25 1050 85 1200 55 C1350 25 1650 85 1800 55 C1950 25 2250 85 2400 55 V120 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>

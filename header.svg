<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Bipul Singh - Full Stack and Backend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <!-- Back wave -->
  <path fill="#ffffff" fill-opacity="0.15"
        d="M0 185 C150 145 450 225 600 185 C750 145 1050 225 1200 185 C1350 145 1650 225 1800 185 C1950 145 2250 225 2400 185 V240 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- Front wave -->
  <path fill="#ffffff" fill-opacity="0.25"
        d="M0 205 C150 175 450 235 600 205 C750 175 1050 235 1200 205 C1350 175 1650 235 1800 205 C1950 175 2250 235 2400 205 V240 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="6s" repeatCount="indefinite"/>
  </path>

  <g text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" opacity="0">
    <text x="600" y="108" font-size="62" font-weight="700">Bipul Singh</text>
    <text x="600" y="156" font-size="26" font-weight="400" fill-opacity="0.92">Full Stack &amp; Backend Developer</text>
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
  </g>
</svg>
